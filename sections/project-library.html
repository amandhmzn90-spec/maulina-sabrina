<!-- Section 5: Project Library -->
<section class="max-w-5xl mx-auto px-6 py-24 space-y-12">
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
        <div class="space-y-2">
            <span class="text-xs font-mono text-neutral-400 tracking-wider uppercase">My Complete Index</span>
            <h2 class="text-3xl font-light text-neutral-900">Project Library</h2>
            <p class="text-sm text-neutral-500">Every single project built to solve a clear, practical problem.</p>
        </div>

        <!-- Category Tabs (built from data.projectLibraryTabs — add a tab there + a matching key in data.projects) -->
        <div class="flex flex-wrap gap-1.5 bg-[#F2EFE9] p-1.5 rounded-xl border border-neutral-200/60 max-w-fit">
            <template x-for="tab in data.projectLibraryTabs" :key="tab.key">
                <button @click="currentTab = tab.key"
                        :class="currentTab === tab.key ? 'bg-white text-neutral-900 shadow-xs' : 'text-neutral-500 hover:text-neutral-800'"
                        class="px-3.5 py-1.5 text-xs font-medium rounded-lg transition-all"
                        x-text="tab.label"></button>
            </template>
        </div>
    </div>

    <!-- Project Cards Matrix based on Alpine Category State -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <template x-for="p in data.projects[currentTab]" :key="p.title">
            <div class="bg-white border border-neutral-200 rounded-2xl p-6 hover:-translate-y-1 hover:shadow-md transition-all flex flex-col justify-between h-[210px]">
                <div class="space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-xl" x-text="p.icon"></span>
                        <span class="text-[10px] font-mono uppercase bg-neutral-100 text-neutral-600 px-2 py-0.5 rounded-md" x-text="p.badge"></span>
                    </div>
                    <h4 class="font-bold text-neutral-800" x-text="p.title"></h4>
                    <p class="text-xs text-neutral-500 leading-relaxed" x-text="p.desc"></p>
                </div>
                <div class="pt-4 border-t border-neutral-100 flex items-center justify-between text-[11px] text-neutral-400">
                    <span x-text="p.stack"></span>
                    <span class="flex items-center gap-1 text-blue-500 font-semibold cursor-pointer">Explore <i data-lucide="arrow-right" class="w-3 h-3"></i></span>
                </div>
            </div>
        </template>
    </div>
</section>
