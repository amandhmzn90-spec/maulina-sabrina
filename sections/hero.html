<!-- Hero Section -->
<main id="home" class="max-w-5xl mx-auto px-6 pt-12 pb-24 grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-8 items-center min-h-[80vh]">

    <!-- Right Hero Interactive Window (The Sticky Notion Box with Picture & Bio) -->
    <div class="lg:col-span-5 w-full">
        <div class="bg-white border border-neutral-200 rounded-2xl shadow-xl overflow-hidden transition-all duration-300 hover:shadow-2xl">
            <!-- Mac Window Controls -->
            <div class="bg-neutral-50 border-b border-neutral-100 px-4 py-3 flex items-center justify-between">
                <div class="flex items-center gap-1.5">
                    <span class="w-3 h-3 rounded-full bg-red-400"></span>
                    <span class="w-3 h-3 rounded-full bg-amber-400"></span>
                    <span class="w-3 h-3 rounded-full bg-green-400"></span>
                </div>
                <span class="text-xs font-mono text-neutral-400 tracking-wide">maulina_profile.jpg</span>
                <span class="w-4"></span>
            </div>

            <!-- Window Content -->
            <div class="p-6 space-y-6">
                <!-- Photo & Quick Status Card -->
                <div class="flex flex-col sm:flex-row items-center gap-5">
                    <!-- Profile Image Frame with beautiful fallback -->
                    <div class="relative group shrink-0">
                        <div class="absolute -inset-1 bg-gradient-to-r from-pink-200 to-blue-200 rounded-2xl blur-xs opacity-75 group-hover:opacity-100 transition duration-300"></div>
                        <img :src="data.profile.photo"
                             :onerror="`this.onerror=null;this.src='${data.profile.photoFallback}'`"
                             :alt="data.profile.name + ' Profile'"
                             class="relative w-24 h-24 sm:w-28 sm:h-28 rounded-xl object-cover border-2 border-white shadow-xs">
                    </div>

                    <!-- Mini Bio Box -->
                    <div class="text-center sm:text-left space-y-1.5">
                        <h3 class="text-lg font-bold text-neutral-800" x-text="data.profile.name"></h3>
                        <p class="text-xs text-neutral-400 font-mono tracking-wide uppercase" x-text="data.profile.role"></p>
                        <p class="text-xs text-neutral-500 flex items-center justify-center sm:justify-start gap-1">
                            <i data-lucide="map-pin" class="w-3.5 h-3.5 text-neutral-400"></i> <span x-text="data.profile.location"></span>
                        </p>
                        <span class="inline-block px-2.5 py-0.5 bg-blue-50 text-blue-600 border border-blue-100 rounded-full text-[10px] font-bold" x-text="data.profile.statusTag"></span>
                    </div>
                </div>

                <!-- Credential Table / Details list -->
                <div class="bg-[#FAF9F5] border border-neutral-200/80 rounded-xl p-4 space-y-3.5 text-xs text-neutral-700">
                    <template x-for="(cred, i) in data.profile.credentials" :key="cred.label">
                        <div class="flex justify-between items-center pb-2 border-b border-neutral-200/40">
                            <span class="font-mono text-neutral-400" x-text="cred.label"></span>
                            <span class="font-medium text-neutral-800"
                                  :class="cred.highlight ? 'font-bold bg-neutral-200/50 px-2 py-0.5 rounded' : ''"
                                  x-text="cred.value"></span>
                        </div>
                    </template>
                    <div class="flex justify-between items-center">
                        <span class="font-mono text-neutral-400">CURRENT STATUS</span>
                        <span class="font-semibold text-emerald-600 flex items-center gap-1">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-ping"></span> <span x-text="data.profile.currentStatus"></span>
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Hint -->
        <p class="text-center text-xs text-neutral-400 mt-4 italic" x-text="data.profile.hint"></p>
    </div>

    <!-- Left Hero Content -->
    <div class="lg:col-span-7 flex flex-col justify-center space-y-6">
        <div class="space-y-4">
            <h1 class="text-4xl md:text-5xl lg:text-6xl font-light text-neutral-900 leading-tight">
                <span x-text="data.hero.greeting"></span> <span class="serif-font italic font-normal text-neutral-700 underline decoration-pink-300 decoration-2 underline-offset-4" x-text="data.hero.name"></span>
            </h1>

            <!-- Introducing Maulina -->
            <p class="text-base text-neutral-600 max-w-xl font-normal leading-relaxed" x-html="data.hero.intro"></p>

            <div class="inline-flex items-center gap-2 bg-emerald-50 border border-emerald-200/80 rounded-full px-3.5 py-1.5 text-xs font-semibold text-emerald-700 tracking-wide max-w-fit shadow-xs animate-pulse">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                <span x-text="data.hero.availability"></span>
            </div>
            <p class="text-sm text-neutral-500 max-w-xl font-normal leading-relaxed" x-text="data.hero.subnote"></p>
        </div>

        <!-- Vibe Badges -->
        <div class="flex flex-wrap gap-2 pt-2">
            <template x-for="badge in data.hero.badges" :key="badge.label">
                <span class="px-3 py-1.5 text-xs font-medium rounded-full flex items-center gap-1.5 shadow-xs border"
                      :class="badge.classes" :title="badge.title || ''">
                    <i :data-lucide="badge.icon" class="w-3.5 h-3.5"></i> <span x-text="badge.label"></span>
                </span>
            </template>
        </div>
    </div>
</main>
