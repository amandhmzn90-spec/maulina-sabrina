<!-- Section 12: Let's Build Something (Contact Form) -->
<section class="max-w-4xl mx-auto px-6 py-24">
    <div class="bg-white border border-neutral-200 rounded-3xl p-8 md:p-12 shadow-md space-y-8 relative overflow-hidden">
        <!-- Background Decorative Blob -->
        <div class="absolute -right-16 -bottom-16 w-48 h-48 bg-pink-100 rounded-full blur-3xl opacity-60"></div>
        <div class="absolute -left-16 -top-16 w-48 h-48 bg-blue-100 rounded-full blur-3xl opacity-40"></div>

        <div class="max-w-2xl space-y-4 relative z-10">
            <span class="px-3 py-1 bg-blue-50 border border-blue-100 text-blue-700 text-xs font-semibold rounded-full uppercase tracking-wider inline-block" x-text="data.contact.badge"></span>
            <h2 class="text-3xl md:text-4xl font-light text-neutral-900 tracking-tight" x-text="data.contact.title"></h2>
            <p class="text-sm text-neutral-500 leading-relaxed" x-text="data.contact.body"></p>
            <p class="text-sm text-neutral-600 font-semibold italic serif-font" x-text="data.contact.quote"></p>
        </div>

        <!-- Custom Interactive Message Box (No window alerts!) -->
        <div class="pt-6 border-t border-neutral-100 space-y-4 relative z-10" x-data="contactForm()">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <input type="text" x-model="name" placeholder="Your name" class="px-4 py-3 bg-[#FAF9F5] border border-neutral-200 rounded-xl text-sm focus:outline-hidden focus:border-neutral-400 transition-colors">
                <input type="email" x-model="email" placeholder="Your email address" class="px-4 py-3 bg-[#FAF9F5] border border-neutral-200 rounded-xl text-sm focus:outline-hidden focus:border-neutral-400 transition-colors">
            </div>
            <textarea x-model="message" rows="4" placeholder="Briefly describe what needs to be easier..." class="w-full px-4 py-3 bg-[#FAF9F5] border border-neutral-200 rounded-xl text-sm focus:outline-hidden focus:border-neutral-400 transition-colors"></textarea>

            <div class="flex flex-col sm:flex-row items-center gap-4 justify-between">
                <button @click="submitMessage" class="w-full sm:w-auto px-6 py-3 bg-neutral-800 text-white font-bold text-xs rounded-xl hover:bg-neutral-900 active:scale-95 transition-all flex items-center justify-center gap-2 shadow-xs">
                    <i data-lucide="send" class="w-3.5 h-3.5"></i> Send Message
                </button>

                <div class="flex items-center gap-2">
                    <template x-for="social in data.contact.socials" :key="social.label">
                        <a :href="social.href" target="_blank" class="p-2.5 bg-[#FAF9F5] hover:bg-neutral-100 border border-neutral-200 rounded-xl text-neutral-600 hover:text-neutral-900 transition-colors" :title="social.label">
                            <i :data-lucide="social.icon" class="w-4 h-4"></i>
                        </a>
                    </template>
                </div>
            </div>

            <!-- Custom Cozy Success Banner -->
            <div class="p-4 bg-emerald-50 border border-emerald-100 rounded-xl text-emerald-800 text-xs flex items-center gap-2.5" x-show="showSuccess" x-transition>
                <i data-lucide="check-circle" class="w-4 h-4 text-emerald-500"></i>
                <span x-text="data.contact.successMessage"></span>
            </div>
        </div>
    </div>
</section>
